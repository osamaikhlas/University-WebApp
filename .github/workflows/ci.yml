name: CI

# Runs on every push/PR — lint, typecheck, unit tests, and the full e2e suite against a real
# throwaway Postgres service container (mirroring local dev, not a mock). Nothing in this
# pipeline skips or bypasses a failure (CLAUDE.md rule 10 / the deployment skill) — a red job
# blocks merge via GitHub's required-checks setting (configure that once in the repo's branch
# protection rules; this file alone can't enforce it).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # A fixed, non-secret 64-hex-char key — only ever used to encrypt/decrypt grievance rows in
  # this job's own throwaway Postgres service container, destroyed when the job ends. Never
  # reused for a real deployment (see .env.example's real GRIEVANCE_ENCRYPTION_KEY guidance).
  GRIEVANCE_ENCRYPTION_KEY: "50554828cdfcf0e8a427679ab3693b7bc3172b13092242a6564db1dd95d38b2b"
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/university_portal_ci?schema=public"
  NODE_ENV: "test"

jobs:
  lint-typecheck-unit:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: university_portal_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate:deploy
      - run: npm run db:seed
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  build:
    name: Production build
    runs-on: ubuntu-latest
    # Deliberately no database/S3 credentials here — `next build` must succeed without a live
    # external service (src/lib/env.ts's own contract; see prisma.ts's lazy-connecting
    # singleton and object-storage.ts's use-time-only S3 check).
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/university_portal_build_placeholder?schema=public"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build
